name: repogeist-github-action

on: push

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - run: docker build -f Backend/RepoGeist/RepoGeist/Dockerfile.prod -t zl23abdessamed/repogeist-backend:${{github.sha}} Backend/RepoGeist/RepoGeist
            - run: docker build -f Frontend/RepoGeist/Dockerfile.prod -t zl23abdessamed/repogeist-frontend:${{github.sha}} Frontend/RepoGeist
            - run: docker push zl23abdessamed/repogeist-backend:${{github.sha}}
            - run: docker push zl23abdessamed/repogeist-frontend:${{github.sha}}

    deploy:
        runs-on: [self-hosted, windows, x64]
        needs: build
        steps:
            - name: Deploy
              shell: powershell
              run: |
                  cd "C:\Users\ZALLA Abdessamed\Desktop\Antigravity Chess\DevOps"
                  docker compose -f docker-compose.final.yaml pull
                  docker compose -f docker-compose.final.yaml up --build